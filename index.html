<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="A little corner of the internet. Say hello!">
  <title>Hello, world!</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem; color: #eef2ff; background: radial-gradient(ellipse at 50% 0%, #28386e 0, #111a36 42%, #0b1020 78%); }
    main { width: min(100%, 680px); padding: clamp(2rem, 7vw, 4.5rem); border: 1px solid #ffffff20; border-radius: 28px; background: #111a36aa; box-shadow: 0 24px 80px #0005; text-align: center; }
    .spark { display: inline-grid; place-items: center; width: 68px; height: 68px; margin-bottom: 1.5rem; border: 1px solid #ffffff25; border-radius: 22px; background: #ffffff10; font-size: 2rem; }
    h1 { margin: 0; font-size: clamp(2.5rem, 9vw, 4.5rem); letter-spacing: -.06em; line-height: 1.05; }
    p { max-width: 38ch; margin: 1.25rem auto 0; color: #c3cbe2; font-size: 1.1rem; line-height: 1.7; }
    .tag { display: inline-block; margin-top: 2rem; padding: .6rem 1rem; border: 1px solid #ffffff25; border-radius: 999px; color: #d6dcff; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <div class="spark" aria-hidden="true">👋</div>
    <h1>Hello, world!</h1>
    <p>Welcome to my little corner of the internet. I’m glad you stopped by.</p>
    <span class="tag">Made with a little HTML and CSS</span>
  </main>
</body>
</html>
